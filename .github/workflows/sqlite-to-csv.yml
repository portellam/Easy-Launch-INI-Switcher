name: SQLite to CSV Export

on:
  push:
    paths:
      - 'db/app.db'
    branches:
      - '**'

jobs:
  export-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Clean up old CSV files
        run: |
          rm -rf csv/* || true

      - name: Export SQLite Tables to CSV
        run: |
          DB_FILE="db/app.db"
          OUTPUT_DIR="csv"

          mkdir --parents "$OUTPUT_DIR"

          tables=$(sqlite3 "$DB_FILE" ".tables")

          for table in $tables; do
            filename=$(echo "$table" | tr '_' '-' | tr '[:upper:]' '[:lower:]').csv

            echo "Exporting $table to $OUTPUT_DIR/$filename..."

            sqlite3 -header -csv "$DB_FILE" "SELECT * FROM $table;" > "$OUTPUT_DIR/$filename" || exit 1
          done

      - name: Commit and Push Changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Automated CSV export from SQLite database [skip ci]"
          add: "csv/*.csv"
          branch: ${{ github.ref }}
